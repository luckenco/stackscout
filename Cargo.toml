[package]
name = "stackscout"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
blake3 = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.1", default-features = false, features = ["std"] }
thiserror = "2"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
# TODO: Upgrade when https://github.com/tree-sitter/tree-sitter-typescript/issues/348
# is fixed, then remove the narrow parser-error allowance in analyze/mod.rs.
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
notify-debouncer-full = "0.7"
rayon = "1"
